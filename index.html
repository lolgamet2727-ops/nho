<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Happy Birthday Azzu</title>

<style>
html, body { margin:0; padding:0; background:black; overflow:hidden; font-family:'Courier New', monospace; }
canvas { position: fixed; top:0; left:0; z-index:0; }

.book {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:500px; height:320px;
  perspective:1600px;
  cursor:pointer;
  z-index:10;
}
.page {
  position:absolute;
  width:100%; height:100%;
  background:#1f0026;
  border:2px solid #c77dff;
  box-shadow:0 0 30px #b84dff;
  transform-origin:left;
  transition: transform 1.2s;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  overflow:hidden;
  padding:10px;
}
.cover { z-index:14; color:#fff; font-size:2.5em; font-weight:bold; animation:pulse 1.2s infinite; }
@keyframes pulse {0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}

.page1 { z-index:13; } /* immagine */
.page2 { z-index:12; } /* dedica */
.page3 { z-index:11; } /* orsetti */

.page-content img { max-width:100%; max-height:220px; border-radius:10px; box-shadow:0 0 20px #ff6bff; }
.page-content { color:#f3d9ff; font-size:1.2em; }
.neon { color:#d46bff; text-shadow:0 0 10px #d46bff,0 0 25px #b84dff,0 0 45px #6a00ff; }

.heart { position:absolute; font-size:2em; color:#ff4d88; animation:beat 1s infinite; }
@keyframes beat {0%,100%{transform:scale(1);}50%{transform:scale(1.4);}}
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<canvas id="fireworks"></canvas>

<div class="book" id="book">
  <div class="page cover">HAPPY BIRTHDAY AZZU</div>
  <div class="page page1"><div class="page-content"><img src="https://raw.githubusercontent.com/lolgamet2727-ops/nho/main/copertina.jpeg" alt="Copertina"></div></div>
  <div class="page page2"><div class="page-content neon">
    <p>Amore mio,<br><br>oggi diventi grande, ma per me resti sempre la persona che mi fa sorridere ogni giorno. Camminare al tuo fianco è il regalo più bello che potessi desiderare.</p>
    <p>Buon compleanno, Azzu.<br>Io ci sarò sempre. 💜</p>
  </div></div>
  <div class="page page3"><div class="page-content"><img src="https://i.imgur.com/7YQZ7ZC.png" alt="Orsetti abbracciati"></div></div>
</div>

<script>
/* ===== MATRIX ===== */
const m = document.getElementById("matrix"), ctx = m.getContext("2d");
m.width = window.innerWidth; m.height = window.innerHeight;
const message="HAPPY BIRTHDAY AZZU", fontSize=20, columns=Math.floor(m.width/fontSize);
const drops=Array(columns).fill(0);
function drawMatrix(){
  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,m.width,m.height);
  ctx.font=fontSize+"px monospace";
  for(let i=0;i<columns;i++){
    const charIndex=Math.floor(drops[i])%message.length;
    const char=message[charIndex];
    const colors=["#d46bff","#b84dff","#ff6bff"];
    ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
    ctx.fillText(char,i*fontSize,drops[i]*fontSize);
    drops[i] = drops[i]*fontSize>m.height ? 0 : drops[i]+0.5;
  }
}
setInterval(drawMatrix,50);

/* ===== FIREWORKS ===== */
const f=document.getElementById("fireworks"), fctx=f.getContext("2d");
f.width=window.innerWidth; f.height=window.innerHeight; let fireworks=[];
setInterval(()=>{
  const x=Math.random()*f.width, y=Math.random()*f.height/2;
  for(let i=0;i<30;i++){fireworks.push({x,y,dx:Math.cos(i)*Math.random()*4,dy:Math.sin(i)*Math.random()*4,life:50});}
},1200);
function drawFireworks(){ fctx.clearRect(0,0,f.width,f.height); fireworks.forEach((p,i)=>{fctx.fillStyle="#ff6bff"; fctx.fillRect(p.x,p.y,3,3); p.x+=p.dx; p.y+=p.dy; if(--p.life<=0) fireworks.splice(i,1); });}
setInterval(drawFireworks,30);

/* ===== BOOK SFOLIO AVANTI/INDIETRO ===== */
const book=document.getElementById("book"), pages=4;
let state=0;
book.onclick=(e)=>{
  const rect=book.getBoundingClientRect();
  const x=e.clientX-rect.left;
  if(x<rect.width/2){ state=Math.max(0,state-1); } else { state=Math.min(pages-1,state+1); }
  updateBook();
};
function updateBook(){
  const pagesDiv=["cover","page1","page2","page3"];
  pagesDiv.forEach((p,i)=>{
    const el=document.querySelector("."+p);
    el.style.transform="rotateY(0deg)";
    if(i<state) el.style.transform="rotateY(-160deg)";
  });
}

/* ===== CUORI PAGINA FINALE ===== */
function createHeart(){
  if(state!==3) return;
  const heart=document.createElement("div");
  heart.className="heart";
  heart.style.left=Math.random()*window.innerWidth+"px";
  heart.style.top=Math.random()*window.innerHeight+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),1000);
}
setInterval(createHeart,500);
</script>
</body>
</html>
