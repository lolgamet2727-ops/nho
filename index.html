<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Azzu</title>
<style>
/* ===== STILI BASE ===== */
html, body {
  margin:0; padding:0;
  background:black; overflow:hidden;
  font-family:'Courier New', monospace;
}
canvas { position:fixed; top:0; left:0; z-index:0; }

/* ===== LIBRO ===== */
.book {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:550px; height:400px;
  perspective:1800px;
  cursor:pointer;
  z-index:10;
}
.page {
  position:absolute; width:100%; height:100%;
  background:#1f0026; border:2px solid #c77dff;
  box-shadow:0 0 40px #b84dff;
  transform-origin:left;
  transition: transform 1.2s cubic-bezier(0.77,0,0.175,1);
  backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; text-align:center;
  overflow:hidden; padding:15px; border-radius:10px;
}
.page1 { z-index:12; }
.page2 { z-index:11; }

/* ===== CONTENUTO ===== */
.page-content img {
  max-width:100%; max-height:250px;
  border-radius:12px; box-shadow:0 0 30px #ff6bff;
}
.page-content { color:#f3d9ff; font-size:1.25em; }
.neon { color:#d46bff; text-shadow:0 0 10px #d46bff,0 0 25px #b84dff,0 0 45px #6a00ff; }

/* ===== CUORI ===== */
.heart {
  position:absolute;
  font-size:2em;
  animation:beat 1s infinite;
}
@keyframes beat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.4);} }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<canvas id="fireworks"></canvas>

<div class="book" id="book">
  <!-- Pagina 1: Dedica e Happy Birthday -->
  <div class="page page1">
    <div class="page-content neon">
      <h1 style="font-size:2em;">🎉 Happy Birthday Azzu 🎉</h1>
      <p>Amore mio,<br><br>oggi diventi grande, ma per me resti sempre la persona che mi fa sorridere ogni giorno. Camminare al tuo fianco è il regalo più bello che potessi desiderare.</p>
      <p>Buon compleanno, Azzu.<br>Io ci sarò sempre. 💜</p>
    </div>
  </div>

  <!-- Pagina 2: Foto finale -->
  <div class="page page2">
    <div class="page-content">
      <img src="https://raw.githubusercontent.com/lolgamet2727-ops/nho/main/copertina.jpeg" alt="Foto finale">
    </div>
  </div>
</div>

<script>
/* ===== MATRIX MULTI-STREAM ===== */
const m=document.getElementById("matrix"), ctx=m.getContext("2d");
m.width=window.innerWidth; m.height=window.innerHeight;

const chars="HAPPY BIRTHDAY AZZU ".split("");
const fontSize=22;
const columns=Math.floor(m.width/fontSize);
let drops=[];
for(let i=0;i<columns;i++){
  drops[i]={y:Math.random()*m.height, speed:Math.random()*1+0.5, length:Math.random()*15+5};
}

function drawMatrix(){
  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,m.width,m.height);
  ctx.font=fontSize+"px monospace";
  for(let i=0;i<columns;i++){
    let drop=drops[i];
    for(let j=0;j<drop.length;j++){
      const char=chars[Math.floor(Math.random()*chars.length)];
      const colors=["#d46bff","#b84dff","#ff6bff"];
      ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
      ctx.fillText(char, i*fontSize, drop.y - j*fontSize);
    }
    drop.y += drop.speed*fontSize;
    if(drop.y - drop.length*fontSize > m.height) drop.y = -fontSize*Math.random()*20;
  }
}
setInterval(drawMatrix,40);

/* ===== FUOCHI D'ARTIFICIO ===== */
const f=document.getElementById("fireworks"), fctx=f.getContext("2d");
f.width=window.innerWidth; f.height=window.innerHeight;
let fireworks=[];
setInterval(()=>{
  const x=Math.random()*f.width;
  const y=Math.random()*f.height/2;
  for(let i=0;i<50;i++){
    fireworks.push({x,y,dx:Math.cos(i)*Math.random()*5,dy:Math.sin(i)*Math.random()*5,life:60});
  }
},900);
function drawFireworks(){
  fctx.clearRect(0,0,f.width,f.height);
  fireworks.forEach((p,i)=>{
    fctx.fillStyle="#ff6bff";
    fctx.fillRect(p.x,p.y,3,3);
    p.x+=p.dx; p.y+=p.dy;
    if(--p.life<=0) fireworks.splice(i,1);
  });
}
setInterval(drawFireworks,25);

/* ===== LIBRO SFOLIO ===== */
const book=document.getElementById("book");
const pages=2;
let state=0;
book.onclick=(e)=>{
  const rect=book.getBoundingClientRect();
  const x=e.clientX-rect.left;
  if(x<rect.width/2) state=Math.max(0,state-1);
  else state=Math.min(pages-1,state+1);
  updateBook();
};
function updateBook(){
  const pagesDiv=["page1","page2"];
  pagesDiv.forEach((p,i)=>{
    const el=document.querySelector("."+p);
    if(i<state){
      el.style.transform="rotateY(-160deg) rotateZ("+(Math.random()*2-1)+"deg)";
    } else {
      el.style.transform="rotateY(0deg)";
    }
  });
}

/* ===== CUORI PAGINA FINALE ===== */
function createHeart(){
  if(state!==1) return;
  const heart=document.createElement("div");
  heart.className="heart";
  heart.style.left=Math.random()*window.innerWidth+"px";
  heart.style.top=Math.random()*window.innerHeight+"px";
  heart.textContent = "❤️🧸"; // emoji cuore + orsetto
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),1200);
}
setInterval(createHeart,400);

/* ===== ADATTAMENTO FINESTRA ===== */
window.addEventListener("resize",()=>{
  m.width=window.innerWidth;
  m.height=window.innerHeight;
  f.width=window.innerWidth;
  f.height=window.innerHeight;
});
</script>

</body>
</html>
